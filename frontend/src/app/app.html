<h1>Currently Playing Song</h1>

@if (currentTrack()?.track; as track) {
  <p>{{ track.title }}</p>
  <p>{{ track.album }}</p>
  <p>{{ track.artist }}</p>

  @if (track.albumArtUrl; as art) {
    <img [src]="art" [alt]="track.album" width="300" />
  }
} @else {
  <p>Nothing is playing right now</p>
}

@if (errorMessage()) {
  <p>{{ errorMessage() }}</p>
}
